      groups:
        - name: Template/Printes
      items:
        - uuid: cf69e33cd81f49e0b5a541fb0411494b
          name: 'Contador de Paginas Impressas Por Dia'
          type: CALCULATED
          key: contador_impressoes_dia
          delay: 0;h00m02
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)
          description: 'Coleta agendada as 00:02hs todos os dias.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas por dia'
        - uuid: 86ef99e14df64fc8b3ede904d417f75d
          name: 'Contador de Paginas Impressas Por Mes'
          type: CALCULATED
          key: contador_impressoes_mes
          delay: 0;md1h00m04
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)
          description: 'Coleta agendada as 00:04hs todo dia 1º de cada mês, conta o total das páginas impressas desde a última coleta total do mês.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas mes'
        - uuid: c50e2c9fba9a4d5dbb056bb08b6c2b52
          name: 'Contador de Paginas Impressas Por Semana'
          type: CALCULATED
          key: contador_impressoes_semana
          delay: 0;wd1h00m03
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)
          description: 'Coleta agendada as 00:03hs toda segunda feira de cada semana, conta o total das páginas impressas desde a última coleta total da semana.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas Por Semana'
        - uuid: c12c1f1470a74015b6e6e6d1e0037165
          name: Ping
          type: SIMPLE
          key: icmpping
          delay: '0;60/1-5,08:00-18:00'
          history: 7d
          value_type: FLOAT
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
          triggers:
            - uuid: b1fcf120808d4d61be5ca8fc89d7570d
              expression: 'max(/Zabbix_Ultimate_Template_Contador_De_Paginas/icmpping,#3)=0'
              name: 'A {HOST.NAME} nao Responde a Ping'
              status: DISABLED
              priority: HIGH
        - uuid: ca0790979a274c6785d1632fb7380006
          name: 'Ping Perdido'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 7d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
          triggers:
            - uuid: d9be9b32d0014709bce30a6a35fab251
              expression: 'min(/Zabbix_Ultimate_Template_Contador_De_Paginas/icmppingloss,5m)>20'
              name: 'A perda de ping está muito alta {HOST.NAME}'
              status: DISABLED
              priority: WARNING
              dependencies:
                - name: 'A {HOST.NAME} nao Responde a Ping'
                  expression: 'max(/Zabbix_Ultimate_Template_Contador_De_Paginas/icmpping,#3)=0'
        - uuid: bbb80a5de95448b3bb95ea4b6873d883
          name: 'Ping por Segundo'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 7d
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
          triggers:
            - uuid: 179d3f34c92c4647bfc4a26722d86258
              expression: 'avg(/Zabbix_Ultimate_Template_Contador_De_Paginas/icmppingsec,5m)>0.15'
              name: 'O tempo de resposta é muito alta na Impressora {HOST.NAME}'
              status: DISABLED
              priority: WARNING
              dependencies:
                - name: 'A {HOST.NAME} nao Responde a Ping'
                  expression: 'max(/Zabbix_Ultimate_Template_Contador_De_Paginas/icmpping,#3)=0'
        - uuid: 4771273330ca4e9ca9460e6f850514b3
          name: 'Paginas Impressas Por Dia'
          type: CALCULATED
          key: impressoes_mes
          delay: '3600'
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)-last(//contador_impressoes_dia)
          description: 'Coleta o total de impressões hoje.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas por dia'
        - uuid: c2967d69c9d74bb2827a601c42362d45
          name: 'Paginas Impressas Por Mes'
          type: CALCULATED
          key: impressoes_mes_01
          delay: '3600'
          history: 60d
          trends: 90d
          status: DISABLED
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)-last(//contador_impressoes_mes)
          description: 'Coleta o total de impressões no mês.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas mes'
        - uuid: 4f7edb6eb98e43a9a960a4686dd0ccad
          name: 'Paginas Impressas Total'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.43.10.2.1.4.1.1
