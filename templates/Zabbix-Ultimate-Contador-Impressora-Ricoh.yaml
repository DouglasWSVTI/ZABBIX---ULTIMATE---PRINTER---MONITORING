          key: impressoes_semana
          delay: '600'
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)-last(//contador_impressoes_semana)
          description: 'Coleta o total de impressões esta semana.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas Por Semana'
        - uuid: 5f97543130ff4b8592f99373e03668d9
          name: 'Preco Resmas Utilizadas Por Mes'
          type: CALCULATED
          key: preco_resmas_usadas_por_mes
          delay: '600'
          history: 60d
          trends: 90d
          params: 'last(//resmas_usadas_por_mes)*20.00'
          description: 'Coleta o total de resmas utilizadas no mês.'
          tags:
            - tag: Application
              value: 'Informacoes de Custo mensal'
        - uuid: b962d667cc874dc7882361698e8e5a0f
          name: 'Resmas Utilizadas Por Mes'
          type: CALCULATED
          key: resmas_usadas_por_mes
          delay: '600'
          history: 60d
          trends: 90d
          units: Resmas
          params: last(//impressoes_mes)/500
          description: 'Coleta o total de resmas utilizadas no mês.'
          tags:
            - tag: Application
              value: 'Informacoes de Custo mensal'
        - uuid: 66883baed4ae4dfe88a911feaca41077
          name: 'Tempo Ligado do Equipamento'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: sysUpTimeInstance
          delay: '3600'
          history: 7d
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
          triggers:
            - uuid: d28d7be753d24d99aaa4e1490933f6e2
              expression: last(/Zabbix_Ultimate_Template_Contador_De_Paginas/sysUpTimeInstance)<600
              name: 'A Impressora {HOST.NAME} Foi Reiniciada'
              status: DISABLED
              priority: INFO
              dependencies:
                - name: 'A {HOST.NAME} nao Responde a Ping'
                  expression: 'max(/Zabbix_Ultimate_Template_Contador_De_Paginas/icmpping,#3)=0'
        - uuid: 5ca842afad714105bf29cc58eb10a3fb
          name: 'Custo Total ao Mes'
          type: CALCULATED
          key: valor_impressoes_mes
          delay: '600'
          history: 60d
          value_type: FLOAT
          trends: 90d
          units: R$
          params: 'last(//impressoes_mes)*0.22'
          description: 'Coleta o total de impressões no mês.'
          tags:
            - tag: Application
              value: 'Informacoes de Custo mensal'
      discovery_rules:
        - uuid: 29a9a4ef3dac476da535a36763dff574
          name: 'Descoberta LLD Descricao do Hardware'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.2.1.25.3.2.1.3]'
          key: hrDeviceDescr
          delay: '86400'
          lifetime_type: DELETE_IMMEDIATELY
