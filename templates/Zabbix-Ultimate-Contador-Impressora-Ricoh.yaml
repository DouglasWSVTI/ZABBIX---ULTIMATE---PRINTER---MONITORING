        - uuid: 3f5af099f9d2414c9113d325e22f86cc
          name: 'Descoberta LLD Rede'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.2.1.2.2.1.2]'
          key: ifDescr
          delay: '86400'
          lifetime: 1d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: fca5fef87d044dfa85814c9a7627a597
              name: 'Status administrativo da Inteface $1'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifAdminStatus.{#SNMPINDEX}'
              key: 'ifAdminStatus[{#SNMPVALUE}]'
              delay: '600'
              history: 7d
              valuemap:
                name: 'SNMP interface status (ifAdminStatus)'
              tags:
                - tag: Application
                  value: 'Informacoes de Status da Placa de Rede'
            - uuid: 628317b50f74455e87576d04770666d1
              name: 'Descricao da Placa de Rede $1'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifDescr.{#SNMPINDEX}'
              key: 'ifDescr[{#SNMPVALUE}]'
              delay: '600'
              history: 7d
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Application
                  value: 'Informacoes de Rede do Equipamento'
            - uuid: 65da6cc56ea046c8b09f42db06cf7a6d
              name: 'Trafego de Entrada Porta $1'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifInOctets.{#SNMPINDEX}'
              key: 'ifInOctets[{#SNMPVALUE}]'
              delay: '600'
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Informacoes de Trafego de Entrada'
            - uuid: d17d68e3fba146708088f1d5a5b3c981
              name: 'Trafego de Saida Porta $1'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOutOctets.{#SNMPINDEX}'
              key: 'ifOutOctets[{#SNMPVALUE}]'
              delay: '600'
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Informacoes de Trafego de Saida'
        - uuid: 830448493c41479d80192b49886e72dc
          name: 'Descoberta LLD Nivel de Papel MP 1'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.2.1.43.8.2.1.18.1]'
          key: prtInputDescriptionMp1
          delay: '60'
          filter:
            conditions:
              - macro: '{#SNMPVALUE}'
                value: ^MP
                formulaid: A
          lifetime_type: DELETE_IMMEDIATELY
          lifetime: '0'
          item_prototypes:
            - uuid: fbdf9028199e4fca8c12565f0732c5e4
              name: 'Nivel de Papel na Bandeja $1 (Porcentagem)'
